
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 20%, #dbeafe 0%, transparent 30%),
                radial-gradient(circle at 90% 80%, #ede9fe 0%, transparent 30%),
                #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .top-label {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 30px;
            color: white;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .top-label h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 9px;
        }

        .top-label p {
            color: #64748b;
            font-size: 14px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid #e2e8f0;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.07);
        }

        .card-title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-description {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: #94a3b8;
            pointer-events: none;
        }

        input, textarea {
            width: 100%;
            padding: 15px 16px 15px 46px;
            border: 1.5px solid #e2e8f0;
            border-radius: 13px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            color: #1e293b;
            background: #f8fafc;
            transition: 0.25s;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
            padding-top: 15px;
            line-height: 1.5;
        }

        input:focus, textarea:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        input::placeholder, textarea::placeholder {
            color: #b0bac9;
        }

        .textarea-icon {
            position: absolute;
            left: 16px;
            top: 17px;
            font-size: 17px;
            color: #94a3b8;
        }

        .error {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #e11d48;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .submit-btn {
            width: 100%;
            border: none;
            padding: 17px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.35);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

        .secure {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            margin-top: 20px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px 20px;
            }

            .top-label h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-label">
        <div class="logo">📦</div>
        <h1>Создать заказ</h1>
        <p>Заполните форму, чтобы оформить новый заказ</p>
    </div>

    <div class="card">

        <div class="card-title">Информация о заказе</div>
        <div class="card-description">
            Укажите необходимые данные для доставки
        </div>

        {% if error %}
            <div class="error">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name_order">Название заказа</label>

                <div class="input-wrapper">
                    <span class="input-icon">🛍️</span>
                    <input
                        type="text"
                        id="name_order"
                        name="name_order"
                        placeholder="Например, Новый смартфон"
                        value="{{ request.POST.name_order|default:'' }}"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="price">Стоимость заказа</label>

                <div class="input-wrapper">
                    <span class="input-icon">💰</span>
                    <input
                        type="number"
                        id="price"
                        name="price"
                        placeholder="Введите стоимость"
                        value="{{ request.POST.price|default:'' }}"
                        min="0"
                        step="1"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="delivery_address">Адрес доставки</label>

                <div class="input-wrapper">
                    <span class="textarea-icon">📍</span>
                    <textarea
                        id="delivery_address"
                        name="delivery_address"
                        placeholder="Улица, дом, квартира..."
                        required
                    >{{ request.POST.delivery_address|default:'' }}</textarea>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Оформить заказ →
            </button>

        </form>

        <div class="secure">
            🔒 Ваши данные используются для оформления заказа
        </div>

    </div>

    <div class="footer">
        © 2026 Order System. Все права защищены.
    </div>

</div>

</body>
</html>
